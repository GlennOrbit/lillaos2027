<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Folkbildningsfacklan till Västerberg</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet"
href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">

<style>    
html,
body{
    margin:0;
    height:100%;
    font-family:Arial,sans-serif;
}

/* KARTAN */

#map{
    height:100vh;
    width:100%;
}


/* PANELEN */

.panel-container{
    position:absolute;
    top:20px;
    left:20px;
    z-index:1000;

    display:flex;
    flex-direction:column;

    gap:15px;

    transition:transform 0.3s ease;
}


/* INFORMATIONSRUTOR */

.info,
.learning-box{
    background:white;

    padding:20px;

    border-radius:14px;

    width:360px;

    box-sizing:border-box;

    box-shadow:0 4px 15px rgba(0,0,0,0.3);

    font-size:17px;
    line-height:1.5;
}


/* RUBRIKER */

h2{
    margin-top:0;
    margin-bottom:15px;

    font-size:28px;
}

.learning-box h3{
    margin-top:0;
    margin-bottom:12px;

    font-size:23px;
}

.learning-box h4{
    margin-top:0;
    margin-bottom:12px;

    font-size:20px;
}


/* MENYKNAPP */

#menuButton{
    display:none;

    position:absolute;

    top:15px;
    right:15px;

    z-index:2000;

    background:white;

    border:none;
    border-radius:10px;

    padding:12px 18px;

    font-size:18px;
    font-weight:bold;

    box-shadow:0 3px 10px rgba(0,0,0,0.3);

    cursor:pointer;
}


/* STOR SKÄRM */

@media (min-width:1200px){

    .panel-container{
        top:30px;
        left:30px;
        gap:20px;
    }

    .info,
    .learning-box{
        width:440px;

        padding:28px;

        font-size:20px;

        border-radius:18px;
    }

    h2{
        font-size:34px;
    }

    .learning-box h3{
        font-size:28px;
    }

    .learning-box h4{
        font-size:24px;
    }
}


/* MOBIL */

@media (max-width:600px){

    /* Visa menyknappen */

    #menuButton{
        display:block;
    }


    /* Panelen ligger ovanpå kartan */

    .panel-container{
        top:70px;
        left:10px;
        right:10px;

        gap:10px;

        transform:translateX(-120%);

        max-height:calc(100vh - 85px);

        overflow-y:auto;
    }


    /* När menyn är öppen */

    .panel-container.open{
        transform:translateX(0);
    }


    /* Rutorna */

    .info,
    .learning-box{
        width:100%;

        padding:18px;

        font-size:16px;

        border-radius:12px;
    }


    h2{
        font-size:25px;
    }

    .learning-box h3{
        font-size:21px;
    }

    .learning-box h4{
        font-size:18px;
    }
}

</style>


</head>

    <body>
<button id="menuButton" onclick="toggleMenu()">
    ☰ Info
</button>

<div class="panel-container"id="panel">

<div class="info">

<h2>🔥 Folkbildningsfacklan</h2>

<div id="countdown"></div>

<br>

<div id="nextPlace"></div>

<br>
    
<div id="placeInfo"></div>
    
<br>

<div id="progress"></div>

</div>

<div class="learning-box">

<div id="dailyLearning"></div>

</div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
        
<script>

const stops = [

{
name:"🏛 Olympia",
lat:37.638,
lng:21.630,
info:"Den olympiska elden tänds här. Olympia symboliserar människans strävan efter utveckling, gemenskap och fredlig tävlan."
},

{
name:"🏛 Aten",
lat:37.9838,
lng:23.7275,
info:"Här föddes demokratin och här verkade Sokrates, Platon och Aristoteles."
},

{
name:"🏛 Rom",
lat:41.9028,
lng:12.4964,
info:"Rom formade lagar, statsförvaltning och idéer som fortfarande påverkar Europa."
},

{
name:"🎨 Florens",
lat:43.7696,
lng:11.2558,
info:"Renässansens centrum där konst, vetenskap och humanism blomstrade."
},

{
name:"📖 Wittenberg",
lat:51.8661,
lng:12.6483,
info:"Här verkade Martin Luther. Reformationen bidrog till ökad läskunnighet och ett nytt synsätt på individen."
},

{
name:"✍️ Weimar",
lat:50.9795,
lng:11.3235,
info:"Goethe och Schiller gjorde Weimar till ett centrum för europeisk kultur och bildning."
},

{
name:"💡 Paris",
lat:48.8566,
lng:2.3522,
info:"Upplysningens idéer om frihet, jämlikhet och vetenskap spreds härifrån."
},

{
name:"🤝 Genève",
lat:46.2044,
lng:6.1432,
info:"En stad för internationellt samarbete, mänskliga rättigheter och diplomati."
},

{
name:"🎓 Köpenhamn",
lat:55.6761,
lng:12.5683,
info:"Grundtvigs idéer lade grunden för den nordiska folkhögskolan."
},

{
name:"📚 Forsa folkhögskola",
lat:61.730,
lng:16.960,
info:"En av Sveriges äldsta folkhögskolor och en viktig del av svensk folkbildning."
},

{
name:"📚 Bollnäs folkhögskola",
lat:61.349,
lng:16.394,
info:"En plats där människor från olika bakgrunder möts för bildning och utveckling."
},

{
name:"🏁 Västerbergs folkhögskola",
lat:60.407,
lng:16.259,
info:"Målet för folkbildningsfacklan och platsen där Lilla OS genomförs."
}

];

const startDate =
new Date("2026-10-02T00:00:00");

const endDate =
new Date("2027-03-17T09:00:00");

const now = new Date();

let progress =
(now - startDate) /
(endDate - startDate);

progress =
Math.max(0, Math.min(1, progress));

const map =
L.map('map');
console.log(L.Routing);
L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(map);

stops.forEach(stop => {

L.marker([stop.lat,stop.lng])
.addTo(map)
.bindPopup(
"<b>" + stop.name + "</b><br><br>" + stop.info
);

});

const allPoints =
stops.map(p => [p.lat,p.lng]);

map.fitBounds(allPoints, {
paddingTopLeft: [480, 50],
paddingBottomRight: [50, 50]
});

const routingControl = L.Routing.control({

    waypoints: stops.map(stop =>
        L.latLng(stop.lat, stop.lng)
    ),

    addWaypoints: false,
    draggableWaypoints: false,
    routeWhileDragging: false,
    show: false,

    lineOptions: {
        styles: [
            {opacity: 0}
        ]
    }

}).addTo(map);

let routeCoordinates = [];    
routingControl.on('routesfound', function(e){

    routeCoordinates =
        e.routes[0].coordinates;

    updateTorch();

});

let torchMarker;
let passedLine;
let remainingLine;
let firstZoom = true;
    
const torchIcon = L.icon({
    iconUrl: 'images/fackelbarare.png',
    iconSize: [72,72 ],
    iconAnchor: [36, 70]
});
 
function updateTorch(){

    const now = new Date();

    let progress =
    (now - startDate) /
    (endDate - startDate);

    progress =
    Math.max(0, Math.min(1, progress));

    const totalSegments =
    stops.length - 1;

    const currentSegment =
    Math.min(
        Math.floor(progress * totalSegments),
        totalSegments - 1
    );

    if(routeCoordinates.length === 0){
        return;
    }

    const routeIndex =
    Math.floor(
        progress *
        (routeCoordinates.length - 1)
    );

    const torchLat =
    routeCoordinates[routeIndex].lat;

    const torchLng =
    routeCoordinates[routeIndex].lng;

    const passedPoints =
    routeCoordinates
        .slice(0, routeIndex + 1)
        .map(point => [point.lat, point.lng]);

    const remaining =
    routeCoordinates
        .slice(routeIndex)
        .map(point => [point.lat, point.lng]);

if(!torchMarker){

    torchMarker =
    L.marker(
        [torchLat, torchLng],
        {
            icon: torchIcon
        }
    ).addTo(map);

    if(firstZoom){

        firstZoom = false;

        setTimeout(() => {

            map.flyTo(
                [torchLat, torchLng],
                7,
                {
                    duration: 5
                }
            );

        }, 3000);

    }

}else{

    torchMarker.setLatLng([
        torchLat,
        torchLng
    ]);

}

    if(passedLine){

        map.removeLayer(
            passedLine
        );

    }

    if(remainingLine){

        map.removeLayer(
            remainingLine
        );

    }

    passedLine =
    L.polyline(
        passedPoints,
        {
            color:'green',
            weight:6
        }
    ).addTo(map);

    remainingLine =
    L.polyline(
        remaining,
        {
            color:'red',
            weight:4,
            dashArray:'10,10'
        }
    ).addTo(map);

    document.getElementById(
        "nextPlace"
    ).innerHTML =

    "<b>🏃 På väg mot</b><br>" +
    stops[currentSegment + 1].name;

    document.getElementById(
        "progress"
    ).innerHTML =

    "<b>📊 " +
    Math.round(progress * 100) +
    "% av färden avklarad</b>";

    document.getElementById(
        "placeInfo"
    ).innerHTML =

    stops[currentSegment + 1].info;

}

function updateCountdown() {

    const now = new Date();

    const diff = endDate - now;

    if (diff <= 0) {
        document.getElementById("countdown").innerHTML =
        "🏁 Folkbildningsfacklan har nått målet!";
        return;
    }

    const days =
    Math.floor(diff / (1000 * 60 * 60 * 24));

    const hours =
    Math.floor((diff / (1000 * 60 * 60)) % 24);

    const minutes =
    Math.floor((diff / (1000 * 60)) % 60);

    const seconds =
    Math.floor((diff / 1000) % 60);

    document.getElementById("countdown").innerHTML =
    "⏳ " +
    days +
    " dagar " +
    hours +
    " timmar " +
    minutes +
    " minuter " +
    seconds +
    " sekunder kvar";
}
    
updateTorch();
 
setInterval(
updateTorch,
1000 * 60 * 30
);

updateCountdown();

setInterval(
updateCountdown,
1000
);

fetch("data/folkbildning.json")
.then(response => response.json())
.then(data => {

    const weeks = data.folkbildningsfacklan;

    const currentWeek =
    Math.floor(
        (new Date() - startDate) /
        (1000 * 60 * 60 * 24 * 7)
    ) + 1;

    const item =
    weeks.find(
        x => Number(x.vecka) === currentWeek
    ) || weeks[0];

document.getElementById("dailyLearning").innerHTML = `
    <h3>📖 Veckans folkbildning</h3>

    <h4>${item.titel}</h4>

    <p>${item.kortIntro}</p>

    <p>
        <b>💭 Fundera:</b><br>
        ${item.reflektionsfraga}
    </p>

    <p style="margin-top:15px">
        <a
            href="artikel.html?vecka=${item.vecka}"
            style="font-weight:bold;color:#0066cc;"
        >
            👉 Fördjupning
        </a>
    </p>
`;



})
.catch(error => {

    console.error(error);

    document.getElementById(
        "dailyLearning"
    ).innerHTML =
    "<h3>📖 Veckans folkbildning</h3><p>Kunde inte ladda innehållet.</p>";
});

   function toggleMenu(){

    const panel =
        document.getElementById("panel");

    const button =
        document.getElementById("menuButton");

    panel.classList.toggle("open");

    if(panel.classList.contains("open")){

        button.innerHTML = "✕ Stäng";

    }else{

        button.innerHTML = "☰ Meny";

    }

}
 
    
</script>

</body>
</html>
