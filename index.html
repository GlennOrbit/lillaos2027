<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
    margin: 0;
    height: 100%;
}

#map {
    height: 100%;
}
</style>

</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const stops = [
    {name:"🏛 Olympia", lat:37.638, lng:21.630},
    {name:"🏛 Aten", lat:37.9838, lng:23.7275},
    {name:"📚 Alexandria", lat:31.2001, lng:29.9187},
    {name:"🏛 Rom", lat:41.9028, lng:12.4964},
    {name:"🎨 Florens", lat:43.7696, lng:11.2558},
    {name:"📖 Wittenberg", lat:51.8661, lng:12.6483},
    {name:"✍️ Weimar", lat:50.9795, lng:11.3235},
    {name:"💡 Paris", lat:48.8566, lng:2.3522},
    {name:"🤝 Genève", lat:46.2044, lng:6.1432},
    {name:"🎓 Köpenhamn", lat:55.6761, lng:12.5683},
    {name:"📚 Forsa folkhögskola", lat:61.730, lng:16.960},
    {name:"📚 Bollnäs folkhögskola", lat:61.349, lng:16.394},
    {name:"🏁 Västerbergs folkhögskola", lat:60.407, lng:16.259}
];

// Skapa karta
var map = L.map('map');

// Bakgrundskarta
L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
 attribution:'&copy; OpenStreetMap'
}
).addTo(map);

// Markörer
stops.forEach(function(stop){
    L.marker([stop.lat, stop.lng])
        .addTo(map)
        .bindPopup(stop.name);
});

// Koordinater till rutten
const routeCoordinates = stops.map(
    stop => [stop.lat, stop.lng]
);

// Rita rutten
const route = L.polyline(
    routeCoordinates,
    {
        color: 'red',
        weight: 4
    }
).addTo(map);

// Anpassa zoom
map.fitBounds(route.getBounds());

// Fackla vid start
const torchIcon = L.divIcon({
    html:'<div style="font-size:32px">🔥</div>',
    className:'',
    iconSize:[32,32]
});

L.marker(
    [stops[0].lat, stops[0].lng],
    {icon:torchIcon}
).addTo(map);

</script>

</body>
</html>
