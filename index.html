<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lilla OS 2027</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;

    background-image:
        linear-gradient(
            rgba(0,0,0,0.4),
            rgba(0,0,0,0.4)
        ),
        url("ChatGPT%20Image%2029%20sep.%202026%2015_37_06.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    text-align:center;
}

    .container{
        padding:40px;
        border-radius:20px;
        background:rgba(255,255,255,0.1);
        backdrop-filter:blur(10px);
        box-shadow:0 8px 30px rgba(0,0,0,0.3);
    }

    h1{
        margin-bottom:30px;
        font-size:2.5rem;
    }

    #countdown{
        display:flex;
        flex-wrap:wrap;
        justify-content:center;
        gap:20px;
    }

    .time-box{
        background:rgba(255,255,255,0.15);
        padding:20px;
        min-width:100px;
        border-radius:12px;
    }

    .number{
        font-size:3rem;
        font-weight:bold;
    }

    .label{
        font-size:1rem;
        margin-top:5px;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Nedräkning till 17 mars 2027</h1>

    <div id="countdown">
        <div class="time-box">
            <div class="number" id="days">0</div>
            <div class="label">Dagar</div>
        </div>

        <div class="time-box">
            <div class="number" id="hours">0</div>
            <div class="label">Timmar</div>
        </div>

        <div class="time-box">
            <div class="number" id="minutes">0</div>
            <div class="label">Minuter</div>
        </div>

        <div class="time-box">
            <div class="number" id="seconds">0</div>
            <div class="label">Sekunder</div>
        </div>
    </div>
</div>

<script>
const targetDate = new Date("2027-03-17T00:00:00");

function updateCountdown() {
    const now = new Date();
    const diff = targetDate - now;

    if (diff <= 0) {
        document.querySelector(".container").innerHTML =
            "<h1>🎉 Dagen är här! 🎉</h1>";
        return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
    document.getElementById("minutes").textContent = minutes;
    document.getElementById("seconds").textContent = seconds;
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
