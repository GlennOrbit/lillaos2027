<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Facklan till Västerberg</title>

<link rel="stylesheet"
href="https://leaflet.css

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
}

#map{
    height:100vh;
    width:100%;
}

.info{
    position:absolute;
    top:15px;
    left:15px;

    z-index:1000;

    background:white;
    padding:15px;
    border-radius:10px;

    box-shadow:0 0 10px rgba(0,0,0,0.3);
}

.info h2{
    margin-top:0;
}

</style>

</head>
<body>

<div class="info">
    <h2>🔥 Facklan till Västerberg</h2>
    <div id="countdown"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/distript>

<script>

// Olympia
const start = [37.638, 21.630];

// Västerbergs folkhögskola
const end = [60.407, 16.259];

// Skapa karta
const map = L.map('map').setView([52,15], 5);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
 maxZoom: 18
}).addTo(map);

// Markörer
L.marker(start)
.addTo(map)
.bindPopup("🏛 Olympia");

L.marker(end)
.addTo(map)
.bindPopup("🏁 Västerbergs folkhögskola");

// Ruttlinje
const route = L.polyline(
[start,end],
{
color:'red',
weight:4
}
).addTo(map);

map.fitBounds(route.getBounds());

// Datum
const journeyStart = new Date("2026-10-02");
const journeyEnd   = new Date("2027-03-17");

// Hur långt har facklan kommit?
const now = new Date();

let progress =
(now - journeyStart) /
(journeyEnd - journeyStart);

progress = Math.max(0, Math.min(1, progress));

// Beräkna position
const lat =
start[0] + (end[0]-start[0]) * progress;

const lng =
start[1] + (end[1]-start[1]) * progress;

// Fackla
const torchIcon = L.divIcon({
    html:"🔥",
    className:"",
    iconSize:[30,30]
});

L.marker([lat,lng], {
icon: torchIcon
}).addTo(map);

// Nedräkning

function updateCountdown(){

const target =
new Date("2027-03-17T00:00:00");

const now = new Date();

const diff = target - now;

const days =
Math.floor(diff/(1000*60*60*24));

const hours =
Math.floor((diff/(1000*60*60))%24);

const minutes =
Math.floor((diff/(1000*60))%60);

document.getElementById("countdown")
.innerHTML =
"<strong>"+days+
"</strong> dagar "+
hours+
" timmar "+
minutes+
" minuter kvar";

}

updateCountdown();
setInterval(updateCountdown,1000);

</script>

</body>
</html>
